# Model Monitoring + Drift Alert Agent
#
#   docker compose up -d --build            start everything
#   docker compose logs -f drift-monitor    follow the monitor's logs
#   docker compose down                     stop (data is kept in named volumes)
#
# Ports on your machine:
#   n8n            http://localhost:5678
#   Grafana        http://localhost:3000
#   drift-monitor  http://localhost:8010    API + Evidently HTML reports (8000 is used by your chroma container)
#   Postgres       localhost:5433           for DBeaver/psql; 5433 avoids clashing with a local Postgres
#
# Ollama runs natively on your PC and is reached from the containers at
# http://host.docker.internal:11434. (An optional Dockerised Ollama is at the bottom.)

name: drift-agent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Read by postgres/init/01-init.sh to create one login per service
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?set MONITOR_DB_PASSWORD in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      # -h 127.0.0.1: only passes once the init scripts have finished (the init server has no TCP)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d monitoring"]
      interval: 10s
      timeout: 5s
      retries: 10

  drift-monitor:
    build: ./monitor
    image: drift-agent/drift-monitor:1.0
    restart: unless-stopped
    environment:
      MONITORING_DATABASE_URL: postgresql://monitor:${MONITOR_DB_PASSWORD}@postgres:5432/monitoring
      REPORT_BASE_URL: ${REPORT_BASE_URL:-http://localhost:8010}
      REPORT_RETENTION: ${REPORT_RETENTION:-50}
      BATCH_SIZE: ${BATCH_SIZE:-400}
    volumes:
      - ./reports:/app/reports            # Evidently HTML + JSON reports, also visible on your PC
    ports:
      - "8010:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2.40.7
    restart: unless-stopped
    environment:
      # n8n keeps its own workflows and execution history in Postgres instead of SQLite
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: ${TZ:-Asia/Kolkata}
      TZ: ${TZ:-Asia/Kolkata}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"                 # plain http on localhost
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # The workflow reads the settings below via $env. n8n 2.x blocks $env unless this is false.
      # Fine for a single-user local stack; use n8n credentials instead on a shared instance.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DRIFT_MONITOR_URL: http://drift-monitor:8000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Docker Desktop provides this already; needed on Linux
    depends_on:
      postgres:
        condition: service_healthy
      drift-monitor:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/drift-overview.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}   # used by the provisioned datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: only if you'd rather not run Ollama natively.
  #   docker compose --profile ollama up -d
  #   docker compose exec ollama ollama pull llama3.1
  # then set OLLAMA_BASE_URL=http://ollama:11434 in .env. (No GPU acceleration by default.)
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11435:11434"   # 11435 so it doesn't clash with your native Ollama on 11434

volumes:
  postgres_data:
  n8n_data:
  grafana_data:
  ollama_data:
